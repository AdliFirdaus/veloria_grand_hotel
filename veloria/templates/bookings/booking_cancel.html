{% extends 'base.html' %}
{% block title %}Cancel Booking - {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-times-circle me-2"></i>Cancel Booking</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                    <h5>Cancel this booking?</h5>
                    <p class="text-muted">Room {{ booking.room.room_number }} | {{ booking.check_in_date }} to {{ booking.check_out_date }}</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger px-4"><i class="fas fa-times me-2"></i>Yes, Cancel</button>
                        </form>
                        <a href="{% url 'bookings:booking_detail' booking.pk %}" class="btn btn-outline-secondary px-4">No, Keep</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
