{% extends 'base.html' %}
{% block title %}Update Booking Status - {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-header bg-navy text-white">
                    <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Update Booking Status</h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small mb-3">Booking ID: {{ booking.id }}</p>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-medium">Status</label>
                            {{ form.status }}
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-navy px-4"><i class="fas fa-save me-2"></i>Update</button>
                            <a href="{% url 'bookings:booking_detail' booking.pk %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
