{% extends 'base.html' %}
{% block title %}Delete Room - {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-trash me-2"></i>Confirm Delete</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                    <h5>Delete Room {{ room.room_number }}?</h5>
                    <p class="text-muted">This action cannot be undone. All bookings for this room may be affected.</p>
                    <div class="d-flex gap-2 justify-content-center mt-3">
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash me-2"></i>Yes, Delete</button>
                        </form>
                        <a href="{% url 'rooms:room_detail' room.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
